apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: production-auth-server
  namespace: production-auth-server
spec:
  refreshInterval: "10m"
  secretStoreRef:
    name: custom-store
    kind: ClusterSecretStore
  target:
    name: production-auth-server
  dataFrom:
    - extract:
        key: production-auth-server
